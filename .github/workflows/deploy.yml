name: Build & deploy

on:
  push:
    branches: [main]
  # Daily rebuild so expired coupons drop off and {{year}} titles stay current.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: article order uses each file's first commit

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Optional repo variable (Settings → Secrets and variables → Actions → Variables)
          SITE_URL: ${{ vars.SITE_URL }}

      # Main host: GitHub Pages (Settings → Pages → Source: GitHub Actions).
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Optional: also upload to Hostinger/FTP hosting once the FTP secrets are added.
      - name: Upload to FTP hosting
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          # Folder on the server, relative to where your FTP account lands. See README.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
